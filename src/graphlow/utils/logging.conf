[loggers]
keys=root, graphlow

[logger_root]
level=ERROR
handlers=console

[logger_graphlow]
level=INFO
handlers=console
propagate=0
qualname=graphlow

[handlers]
keys=console

[handler_console]
class=StreamHandler
formatter=generic
args=(sys.stdout, )

[formatters]
keys=generic

[formatter_generic]
class=logging.Formatter
format=[%(asctime)s] [%(levelname)s] [%(process)d] [%(name)s] [%(funcName)s] [%(lineno)d] %(message)s
datefmt=%Y-%m-%d %H:%M:%S
