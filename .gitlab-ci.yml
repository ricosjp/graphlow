variables:
  # Keep in sync with IMAGE_VERSION in Makefile.docker.
  IMAGE_VERSION: "1.0.0"
  # GitLab CI creates a separate mountpoint for the build directory,
  # so we need to copy instead of using hard links.
  UV_LINK_MODE: copy

# workflow is the pipeline default. GitLab's built-in default includes
# branch and tag pipelines; this project uses merge requests, tags, and
# manual web runs instead. A push to a protected branch is the exception.
# A commit message that starts with [skip ci] creates no pipeline at all.
# Jobs without rules run in every pipeline created here. A push to a branch
# that already has an open merge request does not also create a branch pipeline.
workflow:
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /^\[skip ci\]/'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'

stages:
  - build-images
  - setup
  - test
  - deploy

# -----------------------------------------------------------------------------
# build CI image for CPU and GPU
# -----------------------------------------------------------------------------

# Track the Docker 29 eMudhra revocation, which rejects certificate chains
# that include the compromised intermediates.
# https://docs.docker.com/engine/release-notes/29/
# We intentionally don't pin the Docker version. CI failures are easy to notice,
# while running an unsupported version could go unnoticed
build-images:
  stage: build-images
  image:
    name: docker:cli
    pull_policy: always
  services:
    - name: docker:dind
      alias: docker
      pull_policy: always
  before_script:
    - docker version
    - apk add --no-cache make
  script:
    - make push_docker_images
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - docker/ci.Dockerfile
        - Makefile.docker
      when: manual
      allow_failure: false
  tags:
    - no-gpu

# -----------------------------------------------------------------------------
# Templates
# -----------------------------------------------------------------------------

.cpu-job:
  image: "$CI_REGISTRY_IMAGE:${IMAGE_VERSION}-cpu"
  before_script:
    - 'echo "Using CPU image: $CI_REGISTRY_IMAGE:${IMAGE_VERSION}-cpu"'

.gpu-job:
  image: "$CI_REGISTRY_IMAGE:${IMAGE_VERSION}-cu124"
  before_script:
    - 'echo "Using GPU image: $CI_REGISTRY_IMAGE:${IMAGE_VERSION}-cu124"'

.docs-job:
  image: "$CI_REGISTRY_IMAGE:${IMAGE_VERSION}-cpu"
  before_script:
    - 'echo "Using CPU image: $CI_REGISTRY_IMAGE:${IMAGE_VERSION}-cpu"'
    - apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb && rm -rf /var/lib/apt/lists/*

# -----------------------------------------------------------------------------
# setup stage
# -----------------------------------------------------------------------------

system-check:
  extends: .cpu-job
  stage: setup
  script:
    - make show_system
  tags:
    - no-gpu

# -----------------------------------------------------------------------------
# test stage
# -----------------------------------------------------------------------------

lint:
  extends: .cpu-job
  stage: test
  script:
    - uv sync --group lint
    - make lint
  tags:
    - no-gpu

cpu-test:
  extends: .cpu-job
  stage: test
  script:
    - uv sync --group test --extra cpu
    - make cpu-test
    - mkdir -p coverage-cpu && mv .coverage coverage-cpu/
  artifacts:
    paths:
      - coverage-cpu/
  tags:
    - no-gpu
    - GenuineIntel
    - avx2
    - cpu-ge-8
    - mem-ge-32gb

gpu-test:
  extends: .gpu-job
  stage: test
  script:
    - uv sync --group test --extra cu124
    - make gpu-test
    - mkdir -p coverage-gpu && mv .coverage coverage-gpu/
  artifacts:
    paths:
      - coverage-gpu/
  tags:
    - gpu

slow-test:
  extends: .cpu-job
  stage: test
  needs:
    - job: lint
    - job: cpu-test
    - job: gpu-test
  script:
    - uv sync --group test --extra cpu
    - make slow-test
  tags:
    - no-gpu
    - GenuineIntel
    - avx2
    - cpu-ge-8
    - mem-ge-32gb

document-test:
  extends: .docs-job
  stage: test
  script:
    - uv sync --group docs --extra cpu
    - xvfb-run make document
  tags:
    - no-gpu
    - GenuineIntel
    - avx2
    - cpu-ge-8
    - mem-ge-32gb

coverage:
  extends: .cpu-job
  stage: test
  script:
    - uv run coverage combine coverage-cpu/.coverage coverage-gpu/.coverage
    - uv run coverage report -m
    - uv run coverage xml -o coverage.xml
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
  needs:
    - job: cpu-test
      artifacts: true
    - job: gpu-test
      artifacts: true
  tags:
    - no-gpu

# -----------------------------------------------------------------------------
# deploy stage
# -----------------------------------------------------------------------------

pages:
  extends: .docs-job
  stage: deploy
  script:
    - uv sync --group docs --extra cpu
    - xvfb-run make document
    - mkdir public
    - mv docs/build/* public/
  artifacts:
    paths:
      - public
  only:
    - main
    - develop
    - docs/sphinx-update

.deploy:wheel:
  extends: .cpu-job
  stage: deploy
  script:
    - export VERSION=$CI_COMMIT_REF_NAME
    - uv version $VERSION
    - uv build
    - uv publish --username __token__ --password $PYPI_PUBLISH_TOKEN -n -v

deploy:wheel:tags:
  extends: .deploy:wheel
  only:
    - tags
