variables:
  PYTHON_VERSION: "3.12"
  BASE_LAYER: bookworm-slim
  # GitLab CI creates a separate mountpoint for the build directory,
  # so we need to copy instead of using hard links.
  UV_LINK_MODE: copy

stages:
  - test
  - deploy

default:
  image: astral/uv:python${PYTHON_VERSION}-${BASE_LAYER}
  before_script:
    - apt-get update -qq && apt-get install -y -qq make git

# -----------------------------------------------------------------------------
# test stage
# -----------------------------------------------------------------------------

lint:
  stage: test
  script:
    - uv sync --group lint
    - make lint
  tags:
    - no-gpu

cpu-test:
  stage: test
  script:
    - uv sync --group test --extra cpu
    - make cpu-test
    - mkdir -p coverage-cpu && mv .coverage coverage-cpu/
  artifacts:
    paths:
      - coverage-cpu/
  tags:
    - no-gpu
    - GenuineIntel
    - avx2
    - cpu-ge-8
    - mem-ge-32gb

gpu-test:
  stage: test
  image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
  before_script:
    - apt-get update -qq && apt-get install -y -qq make git
    - pip install uv
  script:
    - uv sync --group test --extra cu124
    - make gpu-test
    - mkdir -p coverage-gpu && mv .coverage coverage-gpu/
  artifacts:
    paths:
      - coverage-gpu/
  tags:
    - gpu

slow-test:
  stage: test
  needs:
    - job: lint
    - job: cpu-test
    - job: gpu-test
  script:
    - uv sync --group test --extra cpu
    - make slow-test
  tags:
    - no-gpu
    - GenuineIntel
    - avx2
    - cpu-ge-8
    - mem-ge-32gb

document-test:
  stage: test
  before_script:
    - apt-get update -qq && apt-get install -y -qq make git xvfb
    - uv sync --group docs --extra cpu
  script:
    - xvfb-run make document
  tags:
    - no-gpu
    - GenuineIntel
    - avx2
    - cpu-ge-8
    - mem-ge-32gb

coverage:
  stage: test
  script:
    - uv run coverage combine coverage-cpu/.coverage coverage-gpu/.coverage
    - uv run coverage report -m
    - uv run coverage xml -o coverage.xml
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
  needs:
    - job: cpu-test
      artifacts: true
    - job: gpu-test
      artifacts: true
  tags:
    - no-gpu

# -----------------------------------------------------------------------------
# deploy stage
# -----------------------------------------------------------------------------

pages:
  stage: deploy
  before_script:
    - apt-get update -qq && apt-get install -y -qq make git xvfb
    - uv sync --group docs --extra cpu
  script:
    - xvfb-run make document
    - mkdir public
    - mv docs/build/* public/
  artifacts:
    paths:
      - public
  only:
    - main
    - develop
    - docs/sphinx-update
    - update/v0.1

.deploy:wheel:
  stage: deploy
  script:
    - uv version $VERSION
    - uv build
    - uv publish --username __token__ --password $PYPI_PUBLISH_TOKEN -n -v

deploy:wheel:tags:
  image: astral/uv:python$PYTHON_VERSION-$BASE_LAYER
  extends: .deploy:wheel
  before_script:
    - export VERSION=$CI_COMMIT_REF_NAME
  only:
    - tags
