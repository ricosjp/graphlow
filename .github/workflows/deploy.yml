name: github pages

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Update CA certificates and install docs dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates xvfb
      - uses: actions/checkout@main
      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: '3.12'
      # Resolved on each run. Pin version if a release breaks the job.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
      - name: Sync project dependencies for docs
        run: uv sync --group docs --extra cpu
      - name: Show system
        run: make show_system
      - name: Build documentation
        run: xvfb-run make document
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/
          retention-days: 1

  deploy:
    needs: build
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # or specific "vX.X.X" version tag for this action
